[metadata]
name = signaldeck-screener
version = 0.1.0
description = Local ETF narrative, technical, and market-condition screening dashboard.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages =
    self_screener
    self_screener.providers
    self_screener.screeners
python_requires = >=3.9

[options.entry_points]
console_scripts =
    signaldeck = self_screener.cli:main
